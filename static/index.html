<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f4; color: #1c1917; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 22px; margin: 8px 0 16px; }
    h2 { font-size: 17px; margin: 24px 0 8px; }
    .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    input, textarea, button { font: inherit; font-size: 16px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #d6d3d1; border-radius: 8px; }
    textarea { min-height: 70px; margin-top: 8px; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; cursor: pointer; white-space: nowrap; }
    button.secondary { background: #e7e5e4; color: #1c1917; }
    .row { display: flex; gap: 8px; align-items: center; }
    .muted { color: #78716c; font-size: 14px; }
    .new { color: #15803d; font-weight: 600; font-size: 14px; margin-top: 6px; }
    .msg { font-size: 14px; margin-top: 6px; color: #4f46e5; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>📚 Book Tracker</h1>

  <div id="login-screen" class="card">
    <p>Enter your email to start</p>
    <div class="row">
      <input id="email" type="email" placeholder="you@gmail.com">
      <button onclick="login()">Go</button>
    </div>
  </div>

  <div id="app-screen" class="hidden">
    <div class="row" style="justify-content: space-between;">
      <span class="muted" id="who"></span>
      <button class="secondary" onclick="logout()">Log out</button>
    </div>

    <h2>Find a series</h2>
    <div class="row">
      <input id="search-box" placeholder="e.g. Mistborn">
      <button onclick="search()">Search</button>
    </div>
    <div id="search-results" style="margin-top: 10px;"></div>

    <h2>My series</h2>
    <div id="my-series"></div>
  </div>
</div>

<script>
  let userId = localStorage.getItem("userId");
  let userEmail = localStorage.getItem("userEmail");

  function esc(text) {
    const div = document.createElement("div");
    div.textContent = text ?? "";
    return div.innerHTML;
  }

  function num(n) {
    return n === null || n === undefined ? "?" : Number(n);
  }

  function showScreen() {
    if (userId) {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("app-screen").classList.remove("hidden");
      document.getElementById("who").textContent = "Logged in as " + userEmail;
      loadMySeries();
    } else {
      document.getElementById("login-screen").classList.remove("hidden");
      document.getElementById("app-screen").classList.add("hidden");
    }
  }

  async function login() {
    const email = document.getElementById("email").value.trim();
    if (!email) return;
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email })
    });
    const data = await res.json();
    userId = data.user_id;
    userEmail = data.email;
    localStorage.setItem("userId", userId);
    localStorage.setItem("userEmail", userEmail);
    showScreen();
  }

  function logout() {
    localStorage.clear();
    userId = null;
    userEmail = null;
    showScreen();
  }

  async function search() {
    const name = document.getElementById("search-box").value.trim();
    const box = document.getElementById("search-results");
    if (!name) return;
    box.innerHTML = "<p class='muted'>Searching...</p>";

    const res = await fetch("/search?name=" + encodeURIComponent(name));
    const results = await res.json();
    results.sort((a, b) => b.readers - a.readers);

    box.innerHTML = "";
    if (results.length === 0) {
      box.innerHTML = "<p class='muted'>No series found.</p>";
      return;
    }

    for (const r of results) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <strong>${esc(r.name)}</strong>
        <div class="muted">${esc(r.author || "Unknown author")} · ${r.readers} readers</div>
        <div class="row" style="margin-top: 8px;">
          <input type="number" min="0" value="0" style="width: 80px;">
          <span class="muted">books read</span>
          <button>Follow</button>
        </div>
        <div class="msg"></div>
      `;
      card.querySelector("button").onclick = () => follow(r, card);
      box.appendChild(card);
    }
  }

  async function follow(r, card) {
    const msg = card.querySelector(".msg");
    const booksRead = parseInt(card.querySelector("input").value) || 0;
    msg.textContent = "Following... (first time can take a few seconds)";

    const res = await fetch("/follow/from-search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user_id: Number(userId),
        hardcover_id: r.hardcover_id,
        name: r.name,
        author: r.author || "Unknown",
        current_book: booksRead
      })
    });
    const data = await res.json();
    msg.textContent = data.message;
    loadMySeries();
  }

  async function loadMySeries() {
    const box = document.getElementById("my-series");
    const res = await fetch("/my-series/" + userId);
    const items = await res.json();

    box.innerHTML = "";
    if (items.length === 0) {
      box.innerHTML = "<p class='muted'>You're not following anything yet. Search above.</p>";
      return;
    }

    for (const item of items) {
      const card = document.createElement("div");
      card.className = "card";
      const hasNew = item.latest_book_number !== null && item.latest_book_number > item.current_book;

      card.innerHTML = `
        <strong>${esc(item.series_name)}</strong>
        <div class="muted">${esc(item.author)}</div>
        <div class="muted">Newest: book ${num(item.latest_book_number)}, ${esc(item.latest_book_title)}</div>
        ${hasNew ? "<div class='new'>📖 There's a book you haven't read yet</div>" : ""}
        <div class="row" style="margin-top: 8px;">
          <span class="muted">I've read</span>
          <input type="number" min="0" value="${num(item.current_book)}" style="width: 80px;">
          <span class="muted">books</span>
        </div>
        <textarea placeholder="Notes: where did you stop, what happened...">${esc(item.notes)}</textarea>
        <div class="row" style="margin-top: 8px;">
          <button>Save</button>
          <span class="msg"></span>
        </div>
      `;
      card.querySelector("button").onclick = () => saveProgress(item.link_id, card);
      box.appendChild(card);
    }
  }

  async function saveProgress(linkId, card) {
    const msg = card.querySelector(".msg");
    const currentBook = parseInt(card.querySelector("input").value) || 0;
    const notes = card.querySelector("textarea").value;

    await fetch("/follow/" + linkId, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ current_book: currentBook, notes: notes })
    });
    msg.textContent = "Saved";
    loadMySeries();
  }

  showScreen();
</script>
</body>
</html>
